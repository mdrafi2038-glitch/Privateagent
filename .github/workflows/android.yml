name: Build Personal Agent APKs
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - name: Build APKs
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true
          gradle :client:assembleDebug :admin:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: personal-agent-apks
          path: |
            client/build/outputs/apk/debug/client-debug.apk
            admin/build/outputs/apk/debug/admin-debug.apk