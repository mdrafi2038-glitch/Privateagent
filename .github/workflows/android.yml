name: Build Personal Agent APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Validate repository
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d client
          test -d admin
          test -f client/build.gradle || test -f client/build.gradle.kts
          test -f admin/build.gradle || test -f admin/build.gradle.kts

      - name: Build Client and Admin APKs
        run: |
          gradle :client:assembleDebug :admin:assembleDebug --no-daemon --stacktrace

      - name: Verify APK outputs
        run: |
          find client/build/outputs/apk admin/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find client/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$(find admin/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: personal-agent-apks
          if-no-files-found: error
          path: |
            client/build/outputs/apk/**/*.apk
            admin/build/outputs/apk/**/*.apk
