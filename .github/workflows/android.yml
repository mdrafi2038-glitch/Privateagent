name: Build Personal Agent APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # GitHub-hosted Ubuntu runners already include Android command-line tools.
      # Avoid setup-android here because its implicit "sdkmanager tools" call
      # fails on current SDK repositories where the legacy "tools" package is gone.
      - name: Configure Android SDK tools
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || {
            echo "Android sdkmanager not found in the runner's preinstalled SDK."
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -print || true
            exit 1
          }

      - name: Install Android SDK packages and accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate repository
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d client
          test -d admin
          test -f client/build.gradle || test -f client/build.gradle.kts
          test -f admin/build.gradle || test -f admin/build.gradle.kts

      - name: Build Client and Admin APKs
        run: |
          gradle :client:assembleDebug :admin:assembleDebug --no-daemon --stacktrace

      - name: Verify APK outputs
        run: |
          find client/build/outputs/apk admin/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find client/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$(find admin/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: personal-agent-apks
          if-no-files-found: error
          path: |
            client/build/outputs/apk/**/*.apk
            admin/build/outputs/apk/**/*.apk
